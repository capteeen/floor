<!doctype html>
<meta charset="utf-8"/>
<title>Floorfi sweep loop</title>
<style>
  html,body{margin:0;background:#07080C;height:100%;display:grid;place-items:center;font-family:system-ui}
  .mop{width:120px;height:120px;border-radius:28px;background:#0E1018;border:1px solid #1C2030;display:grid;place-items:center;animation:sweep 1.2s ease-in-out infinite}
  .f{color:#3DFF9A;font-size:64px;font-weight:800;filter:drop-shadow(0 0 12px #3DFF9A88)}
  @keyframes sweep{0%{transform:translateX(-20px) rotate(-8deg)}50%{transform:translateX(20px) rotate(8deg)}100%{transform:translateX(-20px) rotate(-8deg)}}
</style>
<div class="mop"><div class="f">F</div></div>
