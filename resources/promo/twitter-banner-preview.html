<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sweep banner — X preview</title>
  <style>
    html, body { margin: 0; background: #000; color: #e7e9ea; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    .wrap { width: 1500px; margin: 40px auto; }
    .card { width: 1500px; background: #000; }
    .banner { width: 1500px; height: 500px; display: block; }
    .row { position: relative; height: 110px; }
    .avatar {
      position: absolute;
      left: 48px;
      top: -72px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: #07080C url("../svg/sweep-mark.svg") center/cover;
      border: 8px solid #000;
      box-shadow: 0 0 0 1px #2f3336;
    }
    .meta { padding: 88px 48px 40px; }
    h1 { margin: 0; font-size: 42px; }
    p { margin: 8px 0 0; color: #71767b; font-size: 22px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <img class="banner" src="sweep-twitter-banner.png" alt="Sweep twitter banner" />
      <div class="row"><div class="avatar"></div></div>
      <div class="meta">
        <h1>Sweep</h1>
        <p>@floorfi_onsol · Memecoins that mop the floor.</p>
      </div>
    </div>
  </div>
</body>
</html>
